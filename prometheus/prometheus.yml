global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "windows"
    static_configs:
      - targets:
          - "127.0.0.1:9182"
        labels:
          environment: "development"
          server_name: "DEV-CLOUDOPS-01"